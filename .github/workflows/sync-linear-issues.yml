name: Sync Linear public snapshots

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linear-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync issues
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUES: MUT-173
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "Missing LINEAR_API_KEY secret."
            exit 1
          fi

          for issue in $ISSUES; do
            node scripts/sync-linear-issue.mjs "$issue"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync Linear public snapshots"
          git push
